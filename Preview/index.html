<div class="demo-banner">画面デザインのプレビュー · すべてサンプルデータ · Appleとの接続はiPhoneアプリで行います</div>
<div class="workspace"><aside class="intro"><div class="wordmark"><span id="brand-leaf"></span>rhythm</div><h1>日々を知る。<br>自分を整える。</h1><p>体重、眠り、スマホとの距離。<br>ばらばらだった毎日の記録を、<br>ひとつの心地よい場所へ。</p><div class="features"><div><span>01</span>Appleヘルスケアとつながる</div><div><span>02</span>7日から1年まで、変化に気づく</div><div><span>03</span>記録は、あなたのiPhoneの中に</div></div><small>iPhoneアプリ / SwiftUI・HealthKit・Screen Time<br>この画面は実機の動作結果ではありません。</small></aside>
<div class="phone"><header class="topbar"><div class="wordmark">rhythm<span style="font-size:9px;letter-spacing:.05em;margin-left:5px;color:#66735f">日々のリズム</span></div><button class="sync-button" aria-label="更新" id="refresh"></button></header><main id="main"></main><nav class="nav" role="tablist" aria-label="メインナビゲーション"></nav></div></div>

const mean=arr=>arr.reduce((a,b)=>a+b,0)/arr.length;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function today(){return `<p class="kicker">2026年10月4日 日曜日</p><h2>今日のリズム</h2><p class="subtitle">小さな記録から、心地よい毎日へ。</p><section class="hero"><div class="hero-tag">${icon('leaf')} あなたのペースで</div><h3>まずは、今日の自分を知ろう。</h3><p>数字も、体感も。少しずつ記録すると、<br>自分の変化が見えてきます。</p>${icon('leaf','hero-symbol icon')}</section><div class="section-title"><h3>今日の記録</h3><span>10月4日</span></div>${metricCard('体重','scale',demoEntry?.weight||'68.4','kg','今日の最新の測定値',demoEntry?.weight?'手入力・サンプル':'Apple Health・サンプル')}${metricCard('睡眠','moon',demoEntry?.sleepMinutes!=null?`${Math.floor(demoEntry.sleepMinutes/60)}<small>時間</small>${demoEntry.sleepMinutes%60}`:'7<small>時間</small>42','分','個人目標 7時間30分',demoEntry?.sleep?'手入力・サンプル':'Apple Health・サンプル')}${metricCard('スクリーンタイム','phone','2<small>時間</small>18','分','今日ここまで · 個人目標 3時間 / 日','自動取得・サンプル')}<button class="button" data-action="entry">${icon('plus')}今日の記録・体調を入力</button><p class="footnote">Appleヘルスケア取得 10/4 18:00 · サンプル</p>`}
const TODAY=new Date(2026,9,4);const seeded=(s=>()=>(s=(s*1664525+1013904223)%4294967296)/4294967296)(20261004);const dayKey=d=>`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;

const byKey=new Map(hist.map(h=>[dayKey(h.d),h]));const PERIODS=[['week','7日',7],['month','28日',28],['quarter','3か月',90],['year','1年',365],['monthly','月別',null]];let calIdx=11,snsCalIdx=11;
const avg=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null},count=(rows,k)=>rows.filter(r=>r[k]!=null).length,md=d=>`${d.getMonth()+1}/${d.getDate()}`,ym=d=>`${d.getFullYear()}年${d.getMonth()+1}月`,signed=(v,digits,unit='')=>`${v>=0?'+':'−'}${Math.abs(v).toFixed(digits)}${unit}`;
function periodRows(p){const n=PERIODS.find(x=>x[0]===p)[2];return n?hist.slice(-n):hist.filter(h=>h.d>=new Date(2025,10,1))}
function compareRows(p){const n=PERIODS.find(x=>x[0]===p)[2];if(p==='year')return periodRows(p).map(h=>byKey.get(dayKey(new Date(h.d.getFullYear()-1,h.d.getMonth(),h.d.getDate())))).filter(Boolean);return n?hist.slice(-2*n,-n):[]}
function months(n=12){return Array.from({length:n},(_,i)=>new Date(2026,9-(n-1-i),1))}
function monthRows(m){return hist.filter(h=>h.d.getFullYear()===m.getFullYear()&&h.d.getMonth()===m.getMonth())}
function buckets(rows,k,unit){const g=new Map();rows.forEach(r=>{const s=unit==='week'?new Date(r.d.getFullYear(),r.d.getMonth(),r.d.getDate()-r.d.getDay()):new Date(r.d.getFullYear(),r.d.getMonth(),1),key=dayKey(s);if(!g.has(key))g.set(key,{start:s,rows:[]});g.get(key).rows.push(r)});return[...g.values()].map(b=>{const full=unit==='week'?7:new Date(b.start.getFullYear(),b.start.getMonth()+1,0).getDate();return{start:b.start,avg:avg(b.rows.map(r=>r[k])),n:count(b.rows,k),partial:b.rows.length<full}})}

function svgFrame(min,max,body,labels,aria){const y=v=>150-(v-min)/(max-min)*125,grid=[min,(min+max)/2,max].map(v=>`<line x1="35" x2="325" y1="${y(v)}" y2="${y(v)}" stroke="#e7ebe4"/><text x="0" y="${y(v)+4}">${+v.toFixed(1)}</text>`).join('');return `<svg class="chart" viewBox="0 0 338 185" role="img" aria-label="${aria}">${grid}${body(y)}${labels.map(([x,t,a])=>`<text x="${x}" y="178" text-anchor="${a}">${t}</text>`).join('')}</svg>`}
function lineSvg(rows,k,{min,max,target,ma,aria}){const n=rows.length,x=i=>35+i*(290/Math.max(1,n-1)),vals=ma||rows.map(r=>r[k]);return svgFrame(min,max,y=>{let out=target?`<line x1="35" x2="325" y1="${y(target)}" y2="${y(target)}" stroke="#8b9882" stroke-dasharray="4 4"/>`:'';if(ma)out+=rows.map((r,i)=>r[k]==null?'':`<circle cx="${x(i).toFixed(1)}" cy="${y(r[k]).toFixed(1)}" r="1.6" fill="#115a36" opacity=".25"/>`).join('');let path='',pen=false;vals.forEach((v,i)=>{if(v==null){pen=false;return}path+=`${pen?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)} `;pen=true});out+=`<path d="${path}" fill="none" stroke="#115a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;if(!ma&&n<=31)out+=vals.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#115a36" stroke="#fff" stroke-width="1.5"/>`).join('');return out},[0,Math.round((n-1)/3),Math.round(2*(n-1)/3),n-1].map((i,j)=>[x(i),n>60?`${rows[i].d.getMonth()+1}月`:md(rows[i].d),j===0?'start':j===3?'end':'middle']),aria)}
function barSvg(bars,{max,target,unit,aria}){const n=bars.length,w=290/n,x=i=>35+i*w,step=Math.ceil(n/6);return svgFrame(0,max,y=>bars.map((b,i)=>b.avg==null?'':`<rect x="${(x(i)+w*.18).toFixed(1)}" y="${y(b.avg).toFixed(1)}" width="${(w*.64).toFixed(1)}" height="${(150-y(b.avg)).toFixed(1)}" rx="3" fill="#115a36" opacity="${b.partial?.4:1}"/><text x="${(x(i)+w/2).toFixed(1)}" y="${(y(b.avg)-4).toFixed(1)}" text-anchor="middle" style="font-size:7px">${b.n}日</text>`).join('')+(target?`<line x1="35" x2="325" y1="${y(target)}" y2="${y(target)}" stroke="#8b9882" stroke-dasharray="4 4"/>`:''),bars.map((b,i)=>[x(i)+w/2,unit==='week'?md(b.start):`${b.start.getMonth()+1}月`,'middle']).filter((_,i)=>i%step===0),aria)}
function calendar(kind){const idx=kind==='sns'?snsCalIdx:calIdx,m=months()[idx],last=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),max=kind==='sns'?Math.max(.1,...monthRows(m).map(r=>r.sns||0)):7.5*1.2,none=kind==='sns'?'Apple側に記録なし':'未記録';let cells=['日','月','火','水','木','金','土'].map(w=>`<span class="cal-head">${w}</span>`).join('')+'<span></span>'.repeat(m.getDay());for(let d=1;d<=last;d++){const date=new Date(m.getFullYear(),m.getMonth(),d),h=date<TODAY?byKey.get(dayKey(date)):null,v=h?h[kind]:null,level=v==null?null:Math.min(1,v/max);cells+=`<span class="cal-cell${level==null?' none':''}" style="${level==null?'':`background:rgba(17,90,54,${(.12+level*.88).toFixed(2)});color:${level>.6?'#fff':'inherit'}`}" aria-label="${m.getMonth()+1}月${d}日 ${v==null?none:duration(Math.round(v*60))}">${d}</span>`}return `<div class="month-nav"><button data-cal="${kind}" data-step="-1" ${idx===0?'disabled':''} aria-label="前の月">‹</button><strong>${ym(m)}</strong><button data-cal="${kind}" data-step="1" ${idx===11?'disabled':''} aria-label="次の月">›</button></div><div class="cal">${cells}</div><p class="tiny" style="margin-top:8px">濃いほど長い · 無色は${none}（0ではありません）· サンプル</p>`}
function monthCompare(k,fmt){const m=months()[10],a=avg(monthRows(m).map(r=>r[k])),b=avg(monthRows(new Date(m.getFullYear(),m.getMonth()-1,1)).map(r=>r[k])),c=avg(monthRows(new Date(m.getFullYear()-1,m.getMonth(),1)).map(r=>r[k])),diff=x=>x==null||a==null?'記録なし':fmt(a-x);return{m,a,n:count(monthRows(m),k),text:`先月比 ${diff(b)} · 前年同月比 ${diff(c)}`}}
function review(){const p=range,rows=periodRows(p),prev=compareRows(p),long=['quarter','year','monthly'].includes(p),cmp=p==='year'?'前年同期間':`前の${rows.length}日`,unit=p==='quarter'?'week':'month',fmtD=d=>long?`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`:`${d.getMonth()+1}月${d.getDate()}日`;
const periodLine=p==='monthly'?`${ym(months()[0])} 〜 ${ym(months()[11])} · 今月は昨日まで`:`${fmtD(rows[0].d)} 〜 ${fmtD(rows[rows.length-1].d)} · 昨日まで`;
const summary=p==='monthly'?`<div class="summary-grid three">${[['sleep','moon','睡眠','時間',1],['weight','scale','体重','kg',1],['mood','leaf','体調','/5',1]].map(([k,ic,t,u,dg])=>{const c=monthCompare(k,v=>signed(v,dg,u==='/5'?'':u));return `<article class="card"><div class="label">${icon(ic)}${c.m.getMonth()+1}月の${t}</div><div class="value">${c.a==null?'—':c.a.toFixed(1)}<small>${u}</small></div><div class="change">${c.text}</div><p class="tiny">記録 ${c.n}日 · サンプル</p></article>`}).join('')}</div>`:`<div class="summary-grid">${[['sleep','moon','平均睡眠','時間'],['weight','scale','平均体重','kg']].map(([k,ic,t,u])=>{const a=avg(rows.map(r=>r[k])),b=avg(prev.map(r=>r[k]));return `<article class="card"><div class="label">${icon(ic)}${t}</div><div class="value">${a==null?'—':a.toFixed(1)}<small>${u}</small></div><div class="change">${a!=null&&b!=null?`${cmp}より ${signed(a-b,1,u)}`:'比較する記録がありません'}</div><p class="tiny">記録 ${count(rows,k)}/${rows.length}日 · 比較 ${count(prev,k)}/${prev.length}日 · サンプル</p></article>`}).join('')}</div>`;
let trend;if(metric==='weight'){const v=rows.map(r=>r.weight).filter(x=>x!=null);trend=lineSvg(rows,'weight',{min:Math.floor(Math.min(...v)-.5),max:Math.ceil(Math.max(...v)+.5),ma:long?movingAvg(rows):null,aria:'体重の推移・サンプル'})+`<p class="tiny">${long?'線：7日移動平均（記録3件未満の日は表示なし）· 薄い点：日々の値 · ':''}縦軸は0始まりではありません。</p>`}else if(long){trend=barSvg(buckets(rows,'sleep',unit),{max:10,target:7.5,unit,aria:'睡眠の平均・サンプル'})+`<p class="tiny">${unit==='week'?'週':'月'}平均 · 棒の上は記録日数 · 薄い棒は期間の途中 · 破線：自分で設定した睡眠目標</p>`}else trend=lineSvg(rows,'sleep',{min:0,max:10,target:7.5,aria:'睡眠の日別推移・サンプル'})+`<p class="tiny">破線：自分で設定した睡眠目標</p>`;
const table=p==='monthly'?`<details class="monthly"><summary>月別の数値を見る</summary>${months().slice().reverse().map(m=>{const r=monthRows(m),f=k=>{const a=avg(r.map(x=>x[k]));return a==null?'未記録':a.toFixed(1)};return `<div class="month-row"><strong>${ym(m)}</strong><span>睡眠 ${f('sleep')}時間 · 体重 ${f('weight')}kg · 体調 ${f('mood')}/5</span><span>睡眠の記録 ${count(r,'sleep')}/${r.length}日</span></div>`}).join('')}</details>`:'';
const screenCard=(k,title,ic,max,note)=>{let head;if(p==='monthly'){const c=monthCompare(k,v=>signed(v*60,0,'分')),a=c.a;head=`<p class="tiny">${c.m.getMonth()+1}月の1日平均</p><div class="value">${a==null?'—':duration(Math.round(a*60))}</div><p class="change">${c.text}</p>`}else{const a=avg(rows.map(r=>r[k])),b=avg(prev.map(r=>r[k]));head=`<div class="value">${duration(Math.round(a*60))}<small>/ 日</small></div><p class="change">${b==null?'比較期間はApple側に記録なし':`${cmp}より ${signed((a-b)*60,0,'分')}`} · データ ${count(rows,k)}/${rows.length}日</p>`}return `<article class="card"><div class="label">${icon(ic)}${title}</div>${head}${long?barSvg(buckets(rows,k,unit),{max,unit,aria:`${title}の平均・サンプル`}):lineSvg(rows,k,{min:0,max,aria:`${title}の日別推移・サンプル`})}<p class="tiny">${note}</p></article>`};
return `<p class="kicker">MY RHYTHM</p><h2>振り返り</h2><p class="subtitle">少し離れて、見えてくる。</p><div class="segmented periods" aria-label="振り返り期間">${PERIODS.map(([id,l])=>`<button data-range="${id}" class="${range===id?'active':''}">${l}</button>`).join('')}</div><p class="period">${periodLine}</p>${summary}<article class="card"><div class="section-title"><h3>${long?'長い目で見た変化':'日ごとの変化'}</h3><span>${metric==='sleep'?'時間':'kg'}</span></div><div class="segmented" style="margin-top:8px"><button data-metric="sleep" class="${metric==='sleep'?'active':''}">睡眠</button><button data-metric="weight" class="${metric==='weight'?'active':''}">体重</button></div>${trend}${table}<p class="tiny">出典：Apple Health・サンプルデータ</p></article><article class="card"><div class="section-title"><h3>睡眠カレンダー</h3><span>1か月1枚</span></div>${calendar('sleep')}</article>${screenCard('screen','スクリーンタイム','phone',6,`${long?'棒の上はデータのある日数 · ':''}Appleの専用レポート領域 · サンプル`)}${screenCard('sns','SNSの時間','phone',3,'対象アプリは設定で選択（X・Instagram・YouTube）· データのない日はApple側に記録なし · サンプル')}<article class="card"><div class="section-title"><h3>SNSカレンダー</h3><span>Appleの専用レポート領域</span></div>${calendar('sns')}</article><article class="card insight"><h3>${icon('leaf')}数字から、ひとつ気づく</h3><p>この期間の睡眠は、個人目標より平均10分短めでした。眠りが短かった日のメモを見返してみましょう。</p><p class="tiny" style="margin-top:10px">記録に基づく振り返りの例です。健康状態の診断ではありません。</p></article><p class="tiny">すべて画面確認用のサンプルです（固定の疑似乱数で生成）。</p>`}
function history(){const rows=[['10月4日（日）',demoEntry?.weight||'68.4',demoEntry?.sleep||'7時間42分',demoEntry?.mood||'4',demoEntry?.note||'朝すっきり。今日は少し散歩できた。'],['10月3日（土）','68.4','8時間6分','4','夜のスマホを早めに切り上げた。'],['10月2日（金）','68.5','7時間24分','3','仕事で少し疲れたけど、よく眠れた。']];return `<p class="kicker">DAILY JOURNAL</p><h2>記録</h2><p class="subtitle">その日の数字に、ひとこと添えて。</p><button class="button" data-action="entry" style="margin-bottom:22px">${icon('plus')}今日の記録を入力</button>${rows.map((r,i)=>`<article class="card"><div class="date-line"><strong>${r[0]}</strong>${i===0?'<button data-action="entry">編集 ›</button>':'<span class="source">サンプル</span>'}</div><p style="font-size:12px;margin-top:8px">体重 ${escape(r[1])} kg · 睡眠 ${escape(r[2])}</p><p class="tiny">出典：Apple Health・手入力（サンプル）</p><p class="mood">体調 ${escape(r[3])}/5</p><p class="memo">${escape(r[4])}</p></article>`).join('')}<p class="tiny">プレビューの入力は画面確認用です。再読み込みすると消えます。</p>`}
function settings(){return `<p class="kicker">YOUR PREFERENCES</p><h2>設定</h2><p class="subtitle">自分に合ったリズムをつくろう。</p><div class="section-title"><h3>自動連携</h3></div><section class="card"><div class="setting-row"><span>Appleヘルスケア</span><button data-action="connect">接続を確認</button></div><div class="setting-row"><span>スクリーンタイム</span><button data-action="connect">接続を確認</button></div><p class="tiny" style="margin-top:10px">本番では、起動・復帰・更新操作で最新のデータを読み込みます。</p></section><div class="section-title"><h3>SNSとして数えるアプリ</h3></div><section class="card"><div class="setting-row"><span>選択中：アプリ3件・Webサイト3件 · サンプル</span><button data-action="pick">アプリを選ぶ</button></div><p class="tiny" style="margin-top:10px">X・Instagram・YouTubeと、それぞれのWebサイトを選んでください。アプリ名はRhythmからは読み取れません。選択内容はこのiPhoneの中にだけ保存します。</p></section><div class="section-title"><h3>自分で決める目標</h3></div><section class="card"><label class="setting-row">睡眠（分）<input type="number" min="60" max="960" step="15" value="450" id="sleep-goal"></label><label class="setting-row">スマホ（分）<input type="number" min="0" max="1440" step="15" value="180" id="screen-goal"></label><button class="button secondary" data-action="goal" style="margin-top:12px">目標を保存</button><p class="tiny" style="margin-top:10px">本人が設定する目標です。医学的な推奨値ではありません。</p></section><section class="card insight"><h3>${icon('lock')}あなたの記録は、このiPhoneの中に</h3><p>アカウント登録・広告・外部送信なし。<br>Face IDやパスコードで記録を保護します。</p><p class="tiny" style="margin-top:10px">本番の手入力は端末内保存・バックアップ対象外。アプリ削除や端末交換で失われます。</p></section><div class="notice">自動スクリーンタイムはAppleの専用領域で表示します。体重・睡眠との自動相関分析や外部出力は行いません。</div><p class="footnote">Rhythm 1.1 · 画面プレビュー</p>`}
function render(){main.innerHTML=({today,review,history,settings})[tab]();document.querySelector('.nav').innerHTML=[['today','sun','今日'],['review','chart','振り返り'],['history','book','記録'],['settings','settings','設定']].map(([id,ic,label])=>`<button role="tab" aria-selected="${tab===id}" data-tab="${id}">${icon(ic)}${label}</button>`).join('')}
function entry(){document.getElementById('dialog-content').innerHTML=`<div class="dialog-head"><h3>今日の記録を入力</h3><button class="close" data-action="close" aria-label="閉じる">×</button></div><p class="tiny" style="margin-top:10px">10月4日 · サンプル入力 / 再読み込みで消えます</p><form id="entry-form"><div class="fields"><label>体重（kg）<input name="weight" type="number" min="20" max="400" step="0.1" value="${demoEntry?.weight||'68.4'}"></label><label>睡眠（分）<input name="sleep" type="number" min="0" max="1440" step="1" value="${demoEntry?.sleepMinutes??462}"></label><label>今日の体調<select name="mood"><option value="1">1 · つらい</option><option value="2">2 · いまひとつ</option><option value="3">3 · ふつう</option><option value="4" selected>4 · いい感じ</option><option value="5">5 · とても良い</option></select></label><label>ひとことメモ<textarea name="note" rows="3" maxlength="500" placeholder="今日はどんな1日でしたか？">${escape(demoEntry?.note||'')}</textarea></label></div><p id="form-error"></p><button type="submit" class="button">プレビューに反映</button></form>`;dialog.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})}if(b.dataset.range){range=b.dataset.range;render()}if(b.dataset.cal){const step=Number(b.dataset.step);if(b.dataset.cal==='sns')snsCalIdx=Math.min(11,Math.max(0,snsCalIdx+step));else calIdx=Math.min(11,Math.max(0,calIdx+step));render()}if(b.dataset.action==='pick')toast('実機ではAppleのアプリ選択画面が開きます。');if(b.dataset.metric){metric=b.dataset.metric;render()}if(b.dataset.action==='entry')entry();if(b.dataset.action==='close')dialog.close();if(b.dataset.action==='connect')toast('自動連携は、署名済みiPhoneアプリの実機で行います。');if(b.dataset.action==='goal'){const a=document.getElementById('sleep-goal'),c=document.getElementById('screen-goal');if(a.checkValidity()&&c.checkValidity())toast('これは画面プレビューです。目標は保存されません。');else{a.reportValidity();c.reportValidity()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const data=new FormData(e.target);demoEntry={weight:data.get('weight'),sleep:duration(Number(data.get('sleep'))),sleepMinutes:Number(data.get('sleep')),mood:data.get('mood'),note:data.get('note')};dialog.close();render();toast('サンプルに反映しました（再読み込みで消えます）')});document.getElementById('refresh').innerHTML=icon('refresh');document.getElementById('refresh').onclick=()=>toast('画面プレビューのため、Appleの実データは読み込みません。');document.getElementById('brand-leaf').innerHTML=icon('leaf');render();
</script></body></html>
