<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rhythm — 画面プレビュー</title>
<style>
:root{--green:#115a36;--ink:#1a2923;--muted:#59665e;--bg:#f5f6f2;--line:#e7ebe4}*{box-sizing:border-box}body{margin:0;background:#e9ece5;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Yu Gothic UI",sans-serif;line-height:1.6}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #478164;outline-offset:3px}button{touch-action:manipulation}.demo-banner{padding:8px 16px;background:#233b2c;color:#fff;font-size:11px;letter-spacing:.04em;text-align:center;position:relative;z-index:3}.workspace{max-width:1200px;margin:40px auto;display:grid;grid-template-columns:360px 470px;gap:110px;align-items:start;justify-content:center}.intro{position:sticky;top:60px;padding-top:70px}.wordmark{font-size:26px;letter-spacing:-1px;font-weight:650;color:var(--green);display:flex;align-items:center;gap:9px}.intro h1{font-size:42px;line-height:1.45;letter-spacing:-2px;font-weight:600;margin:36px 0 24px}.intro p{font-size:14px;color:var(--muted);line-height:2}.eyebrow{font-size:11px;letter-spacing:.17em;font-weight:600;color:var(--green)}.features{margin-top:38px;border-top:1px solid #cbd4c9}.features div{padding:15px 0;border-bottom:1px solid #cbd4c9;font-size:13px;display:flex;gap:12px;align-items:center}.features span{font-size:11px;color:var(--muted)}.intro small{display:block;margin-top:28px;color:var(--muted);font-size:11px}.phone{background:var(--bg);border:1px solid #d5ddd2;border-radius:34px;overflow:hidden;box-shadow:0 16px 70px #28422d12;position:relative;min-height:850px}.topbar{height:65px;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;background:var(--bg)}.topbar .wordmark{font-size:23px}.sync-button{border:1px solid #dae3d8;border-radius:50%;height:35px;width:35px;background:transparent;display:grid;place-items:center;color:var(--green)}main{padding:4px 24px 104px;min-height:700px}.kicker{font-size:11px;color:var(--muted);letter-spacing:.04em;margin:14px 0 6px}h2{font-size:29px;letter-spacing:-1px;line-height:1.3;margin:6px 0 10px;font-weight:650}p{margin:0}.subtitle{font-size:12px;color:var(--muted);margin-bottom:25px}.hero{padding:20px;background:#e7ede3;border-radius:20px;margin-bottom:25px;position:relative;overflow:hidden}.hero-tag{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--green);font-weight:600;margin-bottom:9px}.hero h3{font-size:17px;margin:0 0 6px;letter-spacing:-.4px;font-weight:600}.hero p{font-size:11px;color:#50644e;line-height:1.8;max-width:275px}.hero-symbol{position:absolute;right:13px;top:13px;opacity:.08;color:var(--green);width:85px;height:85px;transform:rotate(-15deg)}.section-title{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.section-title h3{font-size:14px;font-weight:650;margin:0}.section-title span{font-size:10px;color:var(--muted)}.card{padding:19px 20px;background:white;border-radius:20px;margin-bottom:13px;border:1px solid #edf0e9}.metric-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.label{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:550;color:var(--muted)}.icon-box{width:28px;height:28px;display:grid;place-items:center;background:#eef3eb;border-radius:8px;color:var(--green)}.source{font-size:9px;color:var(--muted);background:#f5f6f2;border-radius:5px;padding:3px 6px}.value{font-size:36px;font-weight:550;line-height:1.35;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}.value small{font-size:13px;color:var(--muted);letter-spacing:0;margin:0 6px 0 4px;font-weight:400}.metric-bottom{font-size:10px;color:var(--muted);margin-top:7px;display:flex;align-items:center;justify-content:space-between;gap:8px}.progress-track{height:4px;background:#e8eee4;flex:1;max-width:135px;border-radius:5px;overflow:hidden}.progress-track span{display:block;height:100%;background:#427957}.button{width:100%;padding:14px 12px;border:0;border-radius:14px;background:var(--green);color:white;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}.secondary{background:#edf2e8;color:var(--green)}.tiny{font-size:10px;line-height:1.8;color:var(--muted)}.footnote{font-size:10px;color:var(--muted);text-align:center;margin-top:15px}.nav{display:grid;grid-template-columns:repeat(4,1fr);background:#fffffff5;border-top:1px solid var(--line);padding:11px 8px 17px;position:absolute;bottom:0;width:100%;backdrop-filter:blur(14px)}.nav button{background:transparent;border:0;color:#697568;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;min-height:48px;padding:3px}.nav button[aria-selected=true]{color:var(--green);font-weight:700}.nav button[aria-selected=true] svg{background:#e5eee1;box-shadow:0 0 0 7px #e5eee1;border-radius:4px}.nav svg{width:19px;height:19px;margin-bottom:3px}.segmented{display:flex;background:#e7ece3;padding:4px;border-radius:11px;margin:22px 0 13px;gap:4px}.segmented button{flex:1;border:0;border-radius:8px;padding:7px;background:transparent;font-size:11px}.segmented button.active{background:white;box-shadow:0 1px 4px #2535230a;font-weight:650}.period{font-size:10px;color:var(--muted);margin:0 0 16px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary-grid .card{padding:16px 14px}.summary-grid .value{font-size:25px}.change{font-size:10px;color:var(--green);margin-top:8px}.chart{width:100%;height:auto;display:block;margin-top:15px}.chart text{font:10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#59665e}.insight h3{display:flex;gap:8px;align-items:center;font-size:13px;margin:0 0 10px}.insight p{font-size:12px;line-height:1.9}.date-line{display:flex;justify-content:space-between;align-items:center;font-size:13px}.date-line button{border:0;background:none;font-size:11px;color:var(--green);min-height:40px}.mood{font-size:11px;color:var(--green);margin:10px 0}.memo{font-size:12px;line-height:1.8;color:var(--muted)}.setting-row{font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row button{font-size:11px;background:#edf2e8;color:var(--green);border:0;padding:8px 10px;border-radius:8px;min-height:40px}.setting-row input{width:80px;border:1px solid #d6dfd2;border-radius:8px;padding:7px;background:white}.notice{background:#e7ede3;border-radius:10px;padding:12px;font-size:11px;color:#43593e;line-height:1.8}.icon{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.topbar svg{width:17px;height:17px}dialog{border:0;border-radius:22px;padding:0;width:min(430px,calc(100vw - 24px));max-height:85dvh;color:var(--ink);box-shadow:0 20px 70px #00150040}dialog::backdrop{background:#172b2355;backdrop-filter:blur(3px)}.dialog-inner{padding:24px}.dialog-head{display:flex;justify-content:space-between;align-items:center;gap:16px}.dialog-head h3{margin:0;font-size:18px}.close{border:0;background:#eff2eb;width:34px;height:34px;border-radius:50%}.fields{display:grid;gap:15px;margin:20px 0}.fields label{display:grid;gap:6px;font-size:12px}.fields input,.fields textarea,.fields select{padding:11px;border:1px solid #d6dfd2;border-radius:9px;width:100%;background:white;color:var(--ink);font-size:16px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#263e2c;color:white;font-size:12px;padding:12px 20px;border-radius:12px;z-index:5;max-width:90vw}.toast:empty{display:none}svg.spark{width:100px;height:30px;float:right}.subtle-link{border:0;background:transparent;color:var(--green);font-size:11px;padding:8px 0}#form-error{color:#ac3e00;font-size:12px;margin-bottom:12px}.empty{padding:36px 0;text-align:center;font-size:13px;color:var(--muted)}
@media(max-width:900px){.workspace{display:block;margin:0;max-width:520px}.intro{display:none}.phone{border:0;border-radius:0;min-height:calc(100dvh - 34px);box-shadow:none}.demo-banner{font-size:10px}body{background:var(--bg)}main{padding:4px 22px 115px}.nav{position:fixed;left:50%;transform:translateX(-50%);max-width:520px;bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom))}.value{font-size:34px}.topbar{padding:15px 22px}.hero{padding:18px}.hero h3{font-size:16px}}
@media(prefers-reduced-motion:no-preference){main{animation:appear .25s ease}@keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style></head><body>
<div class="demo-banner">画面デザインのプレビュー · すべてサンプルデータ · Appleとの接続はiPhoneアプリで行います</div>
<div class="workspace"><aside class="intro"><div class="wordmark"><span id="brand-leaf"></span>rhythm</div><h1>日々を知る。<br>自分を整える。</h1><p>体重、眠り、スマホとの距離。<br>ばらばらだった毎日の記録を、<br>ひとつの心地よい場所へ。</p><div class="features"><div><span>01</span>Appleヘルスケアとつながる</div><div><span>02</span>7日・28日で変化に気づく</div><div><span>03</span>記録は、あなたのiPhoneの中に</div></div><small>iPhoneアプリ / SwiftUI・HealthKit・Screen Time<br>この画面は実機の動作結果ではありません。</small></aside>
<div class="phone"><header class="topbar"><div class="wordmark">rhythm<span style="font-size:9px;letter-spacing:.05em;margin-left:5px;color:#66735f">日々のリズム</span></div><button class="sync-button" aria-label="更新" id="refresh"></button></header><main id="main"></main><nav class="nav" role="tablist" aria-label="メインナビゲーション"></nav></div></div>
<dialog id="dialog"><div class="dialog-inner" id="dialog-content"></div></dialog><div class="toast" role="status" id="toast"></div>
<script>
'use strict';
const paths={leaf:'M20 4c-7-1-15 2-15 9a6 6 0 0 0 6 6c7 0 9-8 9-15Z M4 21 15 10',sun:'M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6 7 7m10 10 1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4 M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0',moon:'M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z',scale:'M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z M8 7a5 5 0 0 1 8 0l-4 4Z',phone:'M8 2h8a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z M10 18h4',chart:'M4 3v17h17 M7 14l4-5 4 3 5-7',book:'M5 3h14v18H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z M7 3v18m3-13h6m-6 4h4',settings:'M4 7h4m4 0h8M4 17h10m4 0h2 M8 4v6m4-6v6m2 4v6m4-6v6',refresh:'M20 7V3l-3 3a8 8 0 1 0 3 9 M20 7h-5',plus:'M12 5v14M5 12h14',lock:'M7 10V7a5 5 0 0 1 10 0v3 M6 10h12v11H6Z M12 14v3'};
function icon(name,cls='icon'){return `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]||paths.leaf}"/></svg>`}
const main=document.getElementById('main'),dialog=document.getElementById('dialog');let tab='today',range=7,metric='sleep',demoEntry=null;
const days=['9/27','9/28','9/29','9/30','10/1','10/2','10/3'],sleep=[6.5,7.2,6.8,7.8,7.5,7.4,8.1],weight=[68.9,68.8,68.9,68.6,68.7,68.5,68.4],screen=[3.8,3.4,3.7,2.7,3.1,2.5,2.2];
const mean=arr=>arr.reduce((a,b)=>a+b,0)/arr.length;const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const duration=m=>`${Math.floor(m/60)}時間${m%60}分`;
function toast(text){document.getElementById('toast').textContent=text;setTimeout(()=>document.getElementById('toast').textContent='',3500)}
function chart(values,type){let min=type==='weight'?68:0,max=type==='weight'?70:type==='sleep'?10:6;const x=i=>35+i*(290/(values.length-1)),y=v=>150-(v-min)/(max-min)*125;let grid=[min,(min+max)/2,max].map(v=>`<line x1="35" x2="325" y1="${y(v)}" y2="${y(v)}" stroke="#e7ebe4"/><text x="0" y="${y(v)+4}">${v}</text>`).join('');const line=values.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v)}`).join(' ');let labels=values.length===7?['9/27','9/29','10/1','10/3']:['9/6','9/15','9/24','10/3'];return `<svg class="chart" viewBox="0 0 338 185" role="img" aria-label="${type==='weight'?'体重':type==='sleep'?'睡眠':'スマホ時間'}の日別推移・サンプル">${grid}${type==='sleep'?`<line x1="35" x2="325" y1="${y(7.5)}" y2="${y(7.5)}" stroke="#8b9882" stroke-dasharray="4 4"/>`:''}<path d="${line}" fill="none" stroke="#115a36" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#115a36" stroke="#fff" stroke-width="1.5"/>`).join('')}${labels.map((t,i)=>`<text x="${35+i*96.6}" y="178" text-anchor="${i===3?'end':'middle'}">${t}</text>`).join('')}</svg>`}
function metricCard(name,ico,value,unit,detail,source){return `<article class="card"><div class="metric-top"><div class="label"><span class="icon-box">${icon(ico)}</span>${name}</div><span class="source">${source}</span></div><div class="value">${value}<small>${unit}</small></div><div class="metric-bottom"><span>${detail}</span></div></article>`}
function today(){return `<p class="kicker">2026年10月4日 日曜日</p><h2>今日のリズム</h2><p class="subtitle">小さな記録から、心地よい毎日へ。</p><section class="hero"><div class="hero-tag">${icon('leaf')} あなたのペースで</div><h3>まずは、今日の自分を知ろう。</h3><p>数字も、体感も。少しずつ記録すると、<br>自分の変化が見えてきます。</p>${icon('leaf','hero-symbol icon')}</section><div class="section-title"><h3>今日の記録</h3><span>10月4日</span></div>${metricCard('体重','scale',demoEntry?.weight||'68.4','kg','今日の最新の測定値',demoEntry?.weight?'手入力・サンプル':'Apple Health・サンプル')}${metricCard('睡眠','moon',demoEntry?.sleepMinutes!=null?`${Math.floor(demoEntry.sleepMinutes/60)}<small>時間</small>${demoEntry.sleepMinutes%60}`:'7<small>時間</small>42','分','個人目標 7時間30分',demoEntry?.sleep?'手入力・サンプル':'Apple Health・サンプル')}${metricCard('スクリーンタイム','phone','2<small>時間</small>18','分','今日ここまで · 個人目標 3時間 / 日','自動取得・サンプル')}<button class="button" data-action="entry">${icon('plus')}今日の記録・体調を入力</button><p class="footnote">Appleヘルスケア取得 10/4 18:00 · サンプル</p>`}
function review(){let multiplier=range===7?1:4,ss=Array.from({length:multiplier},()=>sleep).flat(),ww=Array.from({length:multiplier},()=>weight).flat(),sc=Array.from({length:multiplier},()=>screen).flat();return `<p class="kicker">MY RHYTHM</p><h2>振り返り</h2><p class="subtitle">少し離れて、見えてくる。</p><div class="segmented" aria-label="振り返り期間"><button data-range="7" class="${range===7?'active':''}">7日間</button><button data-range="28" class="${range===28?'active':''}">28日間</button></div><p class="period">${range===7?'9月27日':'9月6日'} 〜 10月3日 · 昨日まで</p><div class="summary-grid"><article class="card"><div class="label">${icon('moon')}平均睡眠</div><div class="value">${mean(ss).toFixed(1)}<small>時間</small></div><div class="change">前の${range}日より +0.6時間</div><p class="tiny">記録 ${range}/${range}日 · サンプル</p></article><article class="card"><div class="label">${icon('scale')}平均体重</div><div class="value">${mean(ww).toFixed(1)}<small>kg</small></div><div class="change">前の${range}日より −0.3kg</div><p class="tiny">記録 ${range}/${range}日 · サンプル</p></article></div><article class="card"><div class="section-title"><h3>日ごとの変化</h3><span>${metric==='sleep'?'時間':'kg'}</span></div><div class="segmented" style="margin-top:8px"><button data-metric="sleep" class="${metric==='sleep'?'active':''}">睡眠</button><button data-metric="weight" class="${metric==='weight'?'active':''}">体重</button></div>${chart(metric==='sleep'?ss:ww,metric)}<p class="tiny">${metric==='sleep'?'破線：自分で設定した睡眠目標':'縦軸は0始まりではありません。'}</p><p class="tiny">出典：Apple Health・サンプルデータ</p></article><article class="card"><div class="label">${icon('phone')}スクリーンタイム</div><div class="value">3<small>時間</small>3<small>分 / 日</small></div><p class="change">前の${range}日より −32分 · サンプル</p>${chart(sc,'screen')}<p class="tiny">Appleの専用レポート領域 · サンプル</p></article><article class="card insight"><h3>${icon('leaf')}数字から、ひとつ気づく</h3><p>この${range}日間の睡眠は、個人目標より平均10分短めでした。眠りが短かった日のメモを見返してみましょう。</p><p class="tiny" style="margin-top:10px">記録に基づく振り返りの例です。健康状態の診断ではありません。</p></article><p class="tiny">すべて画面確認用のサンプルです。28日表示は同じサンプルを繰り返しています。</p>`}
function history(){const rows=[['10月4日（日）',demoEntry?.weight||'68.4',demoEntry?.sleep||'7時間42分',demoEntry?.mood||'4',demoEntry?.note||'朝すっきり。今日は少し散歩できた。'],['10月3日（土）','68.4','8時間6分','4','夜のスマホを早めに切り上げた。'],['10月2日（金）','68.5','7時間24分','3','仕事で少し疲れたけど、よく眠れた。']];return `<p class="kicker">DAILY JOURNAL</p><h2>記録</h2><p class="subtitle">その日の数字に、ひとこと添えて。</p><button class="button" data-action="entry" style="margin-bottom:22px">${icon('plus')}今日の記録を入力</button>${rows.map((r,i)=>`<article class="card"><div class="date-line"><strong>${r[0]}</strong>${i===0?'<button data-action="entry">編集 ›</button>':'<span class="source">サンプル</span>'}</div><p style="font-size:12px;margin-top:8px">体重 ${escape(r[1])} kg · 睡眠 ${escape(r[2])}</p><p class="tiny">出典：Apple Health・手入力（サンプル）</p><p class="mood">体調 ${escape(r[3])}/5</p><p class="memo">${escape(r[4])}</p></article>`).join('')}<p class="tiny">プレビューの入力は画面確認用です。再読み込みすると消えます。</p>`}
function settings(){return `<p class="kicker">YOUR PREFERENCES</p><h2>設定</h2><p class="subtitle">自分に合ったリズムをつくろう。</p><div class="section-title"><h3>自動連携</h3></div><section class="card"><div class="setting-row"><span>Appleヘルスケア</span><button data-action="connect">接続を確認</button></div><div class="setting-row"><span>スクリーンタイム</span><button data-action="connect">接続を確認</button></div><p class="tiny" style="margin-top:10px">本番では、起動・復帰・更新操作で最新のデータを読み込みます。</p></section><div class="section-title"><h3>自分で決める目標</h3></div><section class="card"><label class="setting-row">睡眠（分）<input type="number" min="60" max="960" step="15" value="450" id="sleep-goal"></label><label class="setting-row">スマホ（分）<input type="number" min="0" max="1440" step="15" value="180" id="screen-goal"></label><button class="button secondary" data-action="goal" style="margin-top:12px">目標を保存</button><p class="tiny" style="margin-top:10px">本人が設定する目標です。医学的な推奨値ではありません。</p></section><section class="card insight"><h3>${icon('lock')}あなたの記録は、このiPhoneの中に</h3><p>アカウント登録・広告・外部送信なし。<br>Face IDやパスコードで記録を保護します。</p><p class="tiny" style="margin-top:10px">本番の手入力は端末内保存・バックアップ対象外。アプリ削除や端末交換で失われます。</p></section><div class="notice">自動スクリーンタイムはAppleの専用領域で表示します。体重・睡眠との自動相関分析や外部出力は行いません。</div><p class="footnote">Rhythm 1.0 · 画面プレビュー</p>`}
function render(){main.innerHTML=({today,review,history,settings})[tab]();document.querySelector('.nav').innerHTML=[['today','sun','今日'],['review','chart','振り返り'],['history','book','記録'],['settings','settings','設定']].map(([id,ic,label])=>`<button role="tab" aria-selected="${tab===id}" data-tab="${id}">${icon(ic)}${label}</button>`).join('')}
function entry(){document.getElementById('dialog-content').innerHTML=`<div class="dialog-head"><h3>今日の記録を入力</h3><button class="close" data-action="close" aria-label="閉じる">×</button></div><p class="tiny" style="margin-top:10px">10月4日 · サンプル入力 / 再読み込みで消えます</p><form id="entry-form"><div class="fields"><label>体重（kg）<input name="weight" type="number" min="20" max="400" step="0.1" value="${demoEntry?.weight||'68.4'}"></label><label>睡眠（分）<input name="sleep" type="number" min="0" max="1440" step="1" value="${demoEntry?.sleepMinutes??462}"></label><label>今日の体調<select name="mood"><option value="1">1 · つらい</option><option value="2">2 · いまひとつ</option><option value="3">3 · ふつう</option><option value="4" selected>4 · いい感じ</option><option value="5">5 · とても良い</option></select></label><label>ひとことメモ<textarea name="note" rows="3" maxlength="500" placeholder="今日はどんな1日でしたか？">${escape(demoEntry?.note||'')}</textarea></label></div><p id="form-error"></p><button type="submit" class="button">プレビューに反映</button></form>`;dialog.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;render();window.scrollTo({top:0,behavior:'instant'})}if(b.dataset.range){range=Number(b.dataset.range);render()}if(b.dataset.metric){metric=b.dataset.metric;render()}if(b.dataset.action==='entry')entry();if(b.dataset.action==='close')dialog.close();if(b.dataset.action==='connect')toast('自動連携は、署名済みiPhoneアプリの実機で行います。');if(b.dataset.action==='goal'){const a=document.getElementById('sleep-goal'),c=document.getElementById('screen-goal');if(a.checkValidity()&&c.checkValidity())toast('これは画面プレビューです。目標は保存されません。');else{a.reportValidity();c.reportValidity()}}});
document.addEventListener('submit',e=>{if(e.target.id!=='entry-form')return;e.preventDefault();const data=new FormData(e.target);demoEntry={weight:data.get('weight'),sleep:duration(Number(data.get('sleep'))),sleepMinutes:Number(data.get('sleep')),mood:data.get('mood'),note:data.get('note')};dialog.close();render();toast('サンプルに反映しました（再読み込みで消えます）')});document.getElementById('refresh').innerHTML=icon('refresh');document.getElementById('refresh').onclick=()=>toast('画面プレビューのため、Appleの実データは読み込みません。');document.getElementById('brand-leaf').innerHTML=icon('leaf');render();
</script></body></html>
